<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Us ♥ Mini Quiz</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #2b2b2b;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 24px 28px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
      position: relative;
    }

    h1 {
      margin-top: 0;
      color: #d81b60;
      font-size: 24px;
    }

    .hearts {
      position: absolute;
      top: -18px;
      right: 18px;
      font-size: 22px;
    }

    .question-number {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #777;
      margin-bottom: 4px;
    }

    .question-text {
      font-size: 18px;
      margin: 10px 0 18px;
      font-weight: 600;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-btn {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      background: #ffe5ec;
      color: #444;
      transition: background 0.2s, transform 0.15s, box-shadow 0.15s;
      text-align: left;
    }

    .option-btn:hover {
      background: #ffc2d1;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(216, 27, 96, 0.25);
    }

    .option-btn.correct {
      background: #c8e6c9;
      color: #1b5e20;
    }

    .option-btn.wrong {
      background: #ffcccb;
      color: #b71c1c;
    }

    .feedback {
      min-height: 22px;
      font-size: 14px;
      margin-bottom: 10px;
      color: #555;
    }

    .nav-btn {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
      background: #d81b60;
      color: #fff;
      transition: background 0.2s, transform 0.15s, box-shadow 0.15s;
    }

    .nav-btn:hover {
      background: #ad1457;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(216, 27, 96, 0.35);
    }

    .nav-btn:disabled {
      opacity: 0.6;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    /* Valentine final screen */
    .valentine-final {
      margin-top: 10px;
    }

    .valentine-question {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 18px;
      color: #d81b60;
    }

    .valentine-buttons {
      position: relative;
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 8px;
      min-height: 60px;
    }

    #yesBtn, #noBtn {
      padding: 10px 24px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
    }

    #yesBtn {
      background: #ff4b8b;
      color: #fff;
      box-shadow: 0 4px 10px rgba(255, 75, 139, 0.4);
    }

    #yesBtn:hover {
      background: #e91e63;
      transform: translateY(-1px);
    }

    #noBtn {
      background: #eeeeee;
      color: #555;
      position: absolute;
    }

    #noBtn:hover {
      background: #e0e0e0;
    }

    .valentine-note {
      font-size: 13px;
      color: #666;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {
      .quiz-container {
        padding: 18px 16px;
      }
      .question-text {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <div class="hearts">💖✨</div>
    <h1>Okay mister, let's see…</h1>
    <div id="quiz-section">
      <div class="question-number" id="q-number"></div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="nav-btn" id="next-btn" disabled>Next ➜</button>
    </div>

    <div id="valentine-section" class="hidden">
      <div class="valentine-final">
        <div class="valentine-question">Last question… Will you be my Valentine? 💘</div>
        <div class="valentine-buttons">
          <button id="yesBtn">Yes</button>
          <button id="noBtn">No</button>
        </div>
        <div class="valentine-note">
          Try clicking <b>No</b> if you dare. Let's see how well you can do it. 😉
        </div>
        <div class="feedback" id="valentine-feedback"></div>
      </div>
    </div>
  </div>

  <script>
    // Quiz data
    const questions = [
      {
        text: "Where did we have our first date?",
        options: ["नगरकोट", "Changu Narayan", "Basantapur", "Swayambhu"],
        correctIndex: 3
      },
      {
        text: "When is our anniversary?",
        options: ["10th of April", "11th of April", "12th of April", "9th of April"],
        correctIndex: 1
      },
      {
        text: "What is my favourite dessert?",
        options: ["Ice cream", "Cheesecake", "Chocolate", "Jerry"],
        correctIndex: 3
      },
      {
        text: "I love when you call me…",
        options: ["pukku", "pukulu", "mayalu", "prashu"],
        correctIndex: 1
      }
    ];

    const savageLines = [
      "Stupid, I'm gonna beat you. 😤",
      "You don't even know this much? 🙄",
      "Five years of relationship and THIS is the level of knowledge you have? 🤦‍♀️"
    ];

    const niceLines = [
      "Perfect. 😌",
      "Nice, good job! 😏",
      "Okay fine, you know me… for now. 😉"
    ];

    let currentQuestion = 0;
    let answered = false;

    const qNumberEl = document.getElementById("q-number");
    const qTextEl = document.getElementById("q-text");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("next-btn");

    const quizSection = document.getElementById("quiz-section");
    const valentineSection = document.getElementById("valentine-section");

    function loadQuestion() {
      const q = questions[currentQuestion];
      qNumberEl.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      qTextEl.textContent = q.text;
      optionsEl.innerHTML = "";
      feedbackEl.textContent = "";
      nextBtn.disabled = true;
      answered = false;

      q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.addEventListener("click", () => handleAnswer(btn, index));
        optionsEl.appendChild(btn);
      });
    }

    function handleAnswer(button, index) {
      if (answered) return;
      answered = true;

      const q = questions[currentQuestion];
      const optionButtons = document.querySelectorAll(".option-btn");

      optionButtons.forEach(btn => {
        btn.disabled = true;
      });

      if (index === q.correctIndex) {
        button.classList.add("correct");
        const nice = niceLines[Math.floor(Math.random() * niceLines.length)];
        feedbackEl.textContent = nice;
      } else {
        button.classList.add("wrong");
        const correctBtn = optionButtons[q.correctIndex];
        if (correctBtn) correctBtn.classList.add("correct");
        const savage = savageLines[Math.floor(Math.random() * savageLines.length)];
        feedbackEl.textContent = savage;
      }

      nextBtn.disabled = false;
    }

    nextBtn.addEventListener("click", () => {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        quizSection.classList.add("hidden");
        valentineSection.classList.remove("hidden");
      }
    });

    loadQuestion();

    // Valentine final: make No button run away
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const valentineFeedback = document.getElementById("valentine-feedback");

    function moveNoButton() {
      const container = document.querySelector(".valentine-buttons");
      const rect = container.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = rect.width - btnRect.width;
      const maxY = rect.height - btnRect.height;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";
    }

    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener("click", () => {
      valentineFeedback.textContent = "I knew it. You're mine. 💕";
      yesBtn.disabled = true;
      noBtn.style.display = "none";
    });
  </script>
</body>
</html>
